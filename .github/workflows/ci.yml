name: ci

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: |
            presign-url/go.sum
            receipt-worker/go.sum
      - name: Build presign-url
        working-directory: presign-url
        run: go build ./...
      - name: Build receipt-worker
        working-directory: receipt-worker
        run: go build ./...
      - name: Unit tests
        working-directory: receipt-worker
        run: go test ./... -v -count=1
